name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The checks below never launch a browser, so skip Playwright's postinstall
  # download. Release builds fetch Chromium explicitly via `npm run browsers`.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  check:
    name: Checks (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20', '22', '24']
        include:
          - os: windows-latest
            node: '20'
          - os: macos-latest
            node: '20'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs against the committed sample workbook, which is what users get.
      - name: Smoke checks
        run: npm run check

      - name: Confirm the sample workbook can be regenerated
        run: npm run sample
